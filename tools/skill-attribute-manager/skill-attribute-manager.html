<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>High Mobility MOBA｜スキル属性管理</title>
  <style>
    :root{--bg:#0b1020;--panel:#121a2d;--panel2:#19233a;--line:#2a3856;--text:#e9eefb;--muted:#9aa9c5;--accent:#6ee7d8;--accent2:#5fa8ff;--danger:#ff7184;--warn:#ffcc66;--shadow:0 16px 50px #0005}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172747 0,#0b1020 42%);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;min-height:100vh}
    button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.sidebar{background:#0d1426eF;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#07101c;font-weight:900}.brand h1{font-size:15px;margin:0}.brand small{display:block;color:var(--muted);font-weight:400}.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0a1120;color:var(--text);outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #5fa8ff22}.char-list{display:grid;gap:7px;margin:14px 0}.char-btn{width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid transparent;padding:10px 12px;border-radius:10px;cursor:pointer}.char-btn:hover{background:#ffffff08}.char-btn.active{background:#5fa8ff17;border-color:#5fa8ff66}.char-btn small{display:block;color:var(--muted)}.add-char{width:100%;border:1px dashed #52688e;background:transparent;color:var(--accent);border-radius:10px;padding:10px;cursor:pointer}.storage-note{color:var(--muted);font-size:12px;margin-top:20px}.main{padding:28px;min-width:0}.topbar{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.title-wrap h2{margin:0;font-size:25px}.title-wrap p{margin:4px 0 0;color:var(--muted)}.nav{display:flex;gap:6px;background:#0a1120;border:1px solid var(--line);padding:5px;border-radius:12px}.nav button,.skill-tabs button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer}.nav button.active,.skill-tabs button.active{background:var(--panel2);color:var(--text)}.card{background:linear-gradient(145deg,#141d32,#10182a);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer}.btn:hover{border-color:#7085aa}.btn.primary{background:linear-gradient(135deg,#45cbbb,#4a8fe8);border:0;color:#07101c;font-weight:700}.btn.danger{color:#ff9aa8}.btn.ghost{background:transparent}.btn.small{padding:5px 8px;font-size:12px}.skill-tabs{display:flex;gap:4px;overflow:auto;margin:18px 0;padding-bottom:4px}.skill-tabs button{min-width:55px;border:1px solid var(--line)}.skill-tabs button.active{border-color:var(--accent2)}.grid2{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr);gap:16px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{color:#bdcae0;font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;background:#0a1120;color:var(--text);padding:9px 10px;outline:none}.field textarea{min-height:90px;resize:vertical}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h3{margin:0;font-size:16px}.muted{color:var(--muted)}.category{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}.category-head{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#172138;padding:10px 12px}.category-head strong code{color:var(--accent);font-weight:500;margin-left:8px}.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:10px}.attr-check{display:flex;align-items:flex-start;gap:8px;border:1px solid #293958;border-radius:9px;padding:9px;background:#0d1527;cursor:pointer}.attr-check:has(input:checked){border-color:#52c9bd;background:#52c9bd12}.attr-check input{accent-color:#54d9ca;margin-top:4px}.attr-check span{min-width:0}.attr-check b{display:block}.attr-check small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selected-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.chip{background:#55d9c91a;border:1px solid #55d9c955;border-radius:999px;padding:5px 9px;color:#bffcf4}.empty{border:1px dashed var(--line);border-radius:12px;padding:25px;text-align:center;color:var(--muted)}.master-grid{display:grid;grid-template-columns:270px 1fr;gap:16px}.master-list{display:grid;gap:7px}.master-row{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:8px;border-radius:10px}.master-row.active{border-color:var(--accent2);background:#5fa8ff11}.master-row .grow{flex:1;cursor:pointer}.master-row code{color:var(--muted);font-size:11px;display:block}.child-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;border-bottom:1px solid #26344f;padding:10px 0}.child-row:last-child{border-bottom:0}.output-layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.preview{width:100%;min-height:520px;background:#080e1a;color:#dce8fa;border:1px solid var(--line);border-radius:12px;padding:14px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}.status{position:fixed;right:20px;bottom:20px;background:#172138;border:1px solid #4b6188;border-radius:10px;padding:9px 13px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.status.show{opacity:1;transform:none}.dialog-back{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:10}.dialog-back.open{display:grid}.dialog{width:min(520px,100%);background:#121b2f;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.dialog h3{margin-top:0}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.danger-zone{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}.file-input{display:none}.count{display:inline-grid;place-items:center;min-width:23px;height:23px;padding:0 6px;border-radius:999px;background:#ffffff0d;color:var(--muted);font-size:11px}.help{padding:12px;border-left:3px solid var(--accent2);background:#5fa8ff0c;color:#bdcae0;border-radius:0 9px 9px 0;margin-bottom:14px}
    @media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.char-list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.main{padding:18px}.topbar{flex-direction:column}.grid2,.master-grid,.output-layout{grid-template-columns:1fr}.nav{width:100%;overflow:auto}.nav button{flex:1}.child-row{grid-template-columns:1fr}.output-layout .card:first-child{order:2}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">HM</div><h1>Skill Attribute Manager<small>High Mobility MOBA</small></h1></div>
    <input id="charSearch" class="search" placeholder="キャラクターを検索">
    <div id="charList" class="char-list"></div>
    <button id="addCharacter" class="add-char">＋ キャラクターを追加</button>
    <p class="storage-note">編集内容はこのブラウザに自動保存されます。大切なデータは「データ管理」からJSONでも保存してください。</p>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="title-wrap"><h2 id="pageTitle">スキル属性</h2><p id="pageSub">親カテゴリから子属性を選択して割り当てます。</p></div>
      <nav class="nav">
        <button data-view="skills" class="active">スキル編集</button>
        <button data-view="master">属性マスター</button>
        <button data-view="output">出力</button>
        <button data-view="data">データ管理</button>
      </nav>
    </div>
    <section id="view"></section>
  </main>
</div>
<div id="dialogBack" class="dialog-back"><div class="dialog"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><div class="dialog-actions"><button id="dialogCancel" class="btn ghost">キャンセル</button><button id="dialogOk" class="btn primary">確定</button></div></div></div>
<div id="status" class="status"></div>
<input id="jsonInput" type="file" class="file-input" accept="application/json,.json">
<script>
(()=>{'use strict';
const STORAGE_KEY='hm-moba-skill-attributes-v1';
const SKILLS=[['AA','通常攻撃'],['P','パッシブ'],['Q','Q'],['W','W'],['E','E'],['R','R']];
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const blankSkills=()=>Object.fromEntries(SKILLS.map(([k,n])=>[k,{name:n,description:'',notes:'',attributeIds:[]}]))
const seed=()=>({schemaVersion:1,updatedAt:new Date().toISOString(),categories:[
 {id:'cat_damage',name:'ダメージ',code:'damage',description:'ダメージの発生方法',attributes:[{id:'a_skill_damage',name:'スキルダメージ',code:'skill',description:'スキルによるダメージ'},{id:'a_basic_damage',name:'通常攻撃ダメージ',code:'basic_attack',description:'通常攻撃によるダメージ'}]},
 {id:'cat_self',name:'自己対象',code:'self',description:'使用者自身に作用する効果',attributes:[{id:'a_self_heal',name:'ヒール',code:'heal',description:'自身の体力を回復する'},{id:'a_self_stealth',name:'ステルス',code:'stealth',description:'自身をステルス状態にする'}]},
 {id:'cat_cc',name:'CC',code:'cc',description:'行動妨害効果',attributes:[{id:'a_snare',name:'スネア',code:'snare',description:'移動を禁止する'},{id:'a_stun',name:'スタン',code:'stun',description:'行動を禁止する'}]},
 {id:'cat_move',name:'移動',code:'movement',description:'位置を変化させる効果',attributes:[{id:'a_blink',name:'ブリンク',code:'blink',description:'瞬間的に位置を移動する'},{id:'a_dash',name:'ダッシュ',code:'dash',description:'経路を伴って高速移動する'}]}
],characters:['ゼルフ','ヴォルブラーク','朧','リネス'].map((name,i)=>({id:'char_'+i,name,code:'',notes:'',skills:blankSkills()}))});
let data=load(),selectedChar=data.characters[0]?.id||null,selectedSkill='AA',view='skills',selectedCategory=data.categories[0]?.id||null,attributeSearch='';
const $=s=>document.querySelector(s),el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&x.schemaVersion===1)return normalize(x)}catch(e){}return seed()}
function normalize(x){x.categories=Array.isArray(x.categories)?x.categories:[];x.characters=Array.isArray(x.characters)?x.characters:[];x.characters.forEach(c=>{c.skills=c.skills||blankSkills();SKILLS.forEach(([k,n])=>c.skills[k]=Object.assign({name:n,description:'',notes:'',attributeIds:[]},c.skills[k]||{}))});return x}
function save(){data.updatedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(data));flash('自動保存しました')}
function flash(msg){const s=$('#status');s.textContent=msg;s.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>s.classList.remove('show'),1300)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currentChar(){return data.characters.find(c=>c.id===selectedChar)}
function allAttributes(){return data.categories.flatMap(c=>c.attributes.map(a=>({...a,category:c,fullCode:c.code+'.'+a.code})))}
function isCode(s){return /^[a-z][a-z0-9_]*$/.test(s)}
function render(){renderSidebar();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={skills:['スキル属性','親カテゴリから子属性を選択して割り当てます。'],master:['属性マスター','二段階属性のカテゴリと子属性を管理します。'],output:['Codex用テキスト','Markdownを確認してコピーまたは保存できます。'],data:['データ管理','JSONバックアップの保存と復元を行います。']};$('#pageTitle').textContent=titles[view][0];$('#pageSub').textContent=titles[view][1];({skills:renderSkills,master:renderMaster,output:renderOutput,data:renderData}[view])()}
function renderSidebar(){const root=$('#charList'),q=$('#charSearch').value.trim().toLowerCase();root.innerHTML='';data.characters.filter(c=>(c.name+' '+c.code).toLowerCase().includes(q)).forEach(c=>{const b=el('button','char-btn'+(c.id===selectedChar?' active':''));b.innerHTML='<strong>'+esc(c.name||'名称未設定')+'</strong><small>'+esc(c.code||'コード未設定')+'</small>';b.onclick=()=>{selectedChar=c.id;view='skills';render()};root.append(b)})}
function renderSkills(){const root=$('#view'),c=currentChar();if(!c){root.innerHTML='<div class="empty">左側からキャラクターを追加してください。</div>';return}const ci=data.characters.indexOf(c);root.innerHTML=`<div class="card"><div class="toolbar"><button class="btn" id="editChar">キャラクター情報</button><button class="btn" id="dupChar">複製</button><button class="btn" id="charUp" ${ci===0?'disabled':''}>↑ 前へ</button><button class="btn" id="charDown" ${ci===data.characters.length-1?'disabled':''}>↓ 後へ</button><button class="btn danger" id="delChar">削除</button><span class="muted">${esc(c.name)}</span></div><div class="skill-tabs" id="skillTabs"></div><div class="grid2"><div><div class="field"><label>スキル名</label><input id="skillName"></div><div class="field"><label>説明</label><textarea id="skillDesc" placeholder="スキルの動作や効果"></textarea></div><div class="field"><label>補足事項</label><textarea id="skillNotes" placeholder="未確定事項、実装上の注意など"></textarea></div><div class="section-title"><h3>選択済み属性</h3><span id="selectedCount" class="count"></span></div><div id="selectedChips" class="selected-chips"></div></div><div><div class="section-title"><h3>属性を選択</h3><input id="attrSearch" class="search" style="max-width:220px" placeholder="属性を検索"></div><div id="attributePicker"></div></div></div></div>`;
 const tabs=$('#skillTabs');SKILLS.forEach(([k,n])=>{const b=el('button',k===selectedSkill?'active':'',k==='AA'?'通常攻撃':k);b.title=n;b.onclick=()=>{selectedSkill=k;renderSkills()};tabs.append(b)});const s=c.skills[selectedSkill];$('#skillName').value=s.name;$('#skillDesc').value=s.description;$('#skillNotes').value=s.notes;['skillName','skillDesc','skillNotes'].forEach((id,i)=>$('#'+id).oninput=e=>{s[['name','description','notes'][i]]=e.target.value;save()});$('#attrSearch').value=attributeSearch;$('#attrSearch').oninput=e=>{attributeSearch=e.target.value;renderAttributePicker()};$('#editChar').onclick=()=>editCharacter(c);$('#dupChar').onclick=()=>duplicateCharacter(c);$('#charUp').onclick=()=>move(data.characters,ci,-1);$('#charDown').onclick=()=>move(data.characters,ci,1);$('#delChar').onclick=()=>deleteCharacter(c);renderAttributePicker();renderSelected()}
function renderAttributePicker(){const box=$('#attributePicker');if(!box)return;box.innerHTML='';const c=currentChar(),s=c.skills[selectedSkill],q=attributeSearch.trim().toLowerCase();let shown=0;data.categories.forEach(cat=>{const attrs=cat.attributes.filter(a=>(cat.name+' '+cat.code+' '+a.name+' '+a.code+' '+a.description).toLowerCase().includes(q));if(!attrs.length)return;shown++;const wrap=el('div','category'),head=el('div','category-head');head.innerHTML='<strong>'+esc(cat.name)+' <code>'+esc(cat.code)+'</code></strong><span class="count">'+attrs.length+'</span>';const list=el('div','attrs');attrs.forEach(a=>{const lab=el('label','attr-check');lab.innerHTML=`<input type="checkbox" ${s.attributeIds.includes(a.id)?'checked':''}><span><b>${esc(a.name)}</b><small>${esc(cat.code+'.'+a.code)}</small></span>`;lab.querySelector('input').onchange=e=>{if(e.target.checked&&!s.attributeIds.includes(a.id))s.attributeIds.push(a.id);if(!e.target.checked)s.attributeIds=s.attributeIds.filter(x=>x!==a.id);save();renderSelected()};list.append(lab)});wrap.append(head,list);box.append(wrap)});if(!shown)box.innerHTML='<div class="empty">該当する属性がありません。属性マスターで追加できます。</div>'}
function renderSelected(){const box=$('#selectedChips');if(!box)return;const s=currentChar().skills[selectedSkill],map=new Map(allAttributes().map(a=>[a.id,a]));box.innerHTML='';s.attributeIds=s.attributeIds.filter(id=>map.has(id));s.attributeIds.forEach(id=>{const a=map.get(id);const ch=el('span','chip',a.category.name+' › '+a.name);box.append(ch)});$('#selectedCount').textContent=s.attributeIds.length;if(!s.attributeIds.length)box.innerHTML='<span class="muted">まだ設定されていません</span>'}
function editCharacter(c){showDialog('キャラクター情報',`<div class="field"><label>表示名</label><input id="dName" value="${esc(c.name)}"></div><div class="field"><label>コード用ID</label><input id="dCode" value="${esc(c.code)}" placeholder="例: zelf"></div><div class="field"><label>メモ</label><textarea id="dNotes">${esc(c.notes)}</textarea></div>`,()=>{const name=$('#dName').value.trim(),code=$('#dCode').value.trim();if(!name)return alert('表示名を入力してください。');if(code&&!isCode(code))return alert('コード用IDは半角小文字・数字・アンダースコアで入力してください。');if(code&&data.characters.some(x=>x.id!==c.id&&x.code===code))return alert('同じコード用IDが存在します。');c.name=name;c.code=code;c.notes=$('#dNotes').value;save();render();return true})}
function duplicateCharacter(c){const copy=JSON.parse(JSON.stringify(c));copy.id=uid('char');copy.name+=' コピー';copy.code='';data.characters.splice(data.characters.indexOf(c)+1,0,copy);selectedChar=copy.id;save();render()}
function deleteCharacter(c){if(!confirm(`「${c.name}」を削除しますか？\nこの操作は元に戻せません。`))return;data.characters=data.characters.filter(x=>x.id!==c.id);selectedChar=data.characters[0]?.id||null;save();render()}
function renderMaster(){const root=$('#view');if(!data.categories.some(c=>c.id===selectedCategory))selectedCategory=data.categories[0]?.id||null;root.innerHTML='<div class="master-grid"><div class="card"><div class="section-title"><h3>親カテゴリ</h3><button class="btn small primary" id="addCat">＋追加</button></div><div id="catList" class="master-list"></div></div><div class="card" id="catEditor"></div></div>';$('#addCat').onclick=()=>categoryDialog();const list=$('#catList');data.categories.forEach((cat,i)=>{const row=el('div','master-row'+(cat.id===selectedCategory?' active':''));const grow=el('div','grow');grow.innerHTML='<b>'+esc(cat.name)+'</b><code>'+esc(cat.code)+'</code>';grow.onclick=()=>{selectedCategory=cat.id;renderMaster()};const up=el('button','btn small','↑'),down=el('button','btn small','↓');up.disabled=i===0;down.disabled=i===data.categories.length-1;up.onclick=()=>move(data.categories,i,-1);down.onclick=()=>move(data.categories,i,1);row.append(grow,up,down);list.append(row)});renderCategoryEditor()}
function renderCategoryEditor(){const box=$('#catEditor'),cat=data.categories.find(c=>c.id===selectedCategory);if(!cat){box.innerHTML='<div class="empty">親カテゴリを追加してください。</div>';return}box.innerHTML=`<div class="section-title"><div><h3>${esc(cat.name)}</h3><span class="muted">${esc(cat.code)} · 子属性 ${cat.attributes.length}件</span></div><div class="toolbar"><button class="btn small" id="editCat">編集</button><button class="btn small danger" id="delCat">削除</button></div></div><p class="muted">${esc(cat.description||'説明なし')}</p><div class="help">コード用IDは「${esc(cat.code)}.子属性ID」の形で出力されます。</div><div id="children"></div><button class="btn primary" id="addChild">＋ 子属性を追加</button>`;$('#editCat').onclick=()=>categoryDialog(cat);$('#delCat').onclick=()=>deleteCategory(cat);$('#addChild').onclick=()=>childDialog(cat);const children=$('#children');cat.attributes.forEach((a,i)=>{const row=el('div','child-row');row.innerHTML=`<div><b>${esc(a.name)}</b><div class="muted">${esc(a.description||'説明なし')}</div></div><div><code>${esc(cat.code+'.'+a.code)}</code></div>`;const acts=el('div','toolbar'),edit=el('button','btn small','編集'),up=el('button','btn small','↑'),down=el('button','btn small','↓'),del=el('button','btn small danger','削除');edit.onclick=()=>childDialog(cat,a);up.disabled=i===0;down.disabled=i===cat.attributes.length-1;up.onclick=()=>{move(cat.attributes,i,-1);renderMaster()};down.onclick=()=>{move(cat.attributes,i,1);renderMaster()};del.onclick=()=>deleteChild(cat,a);acts.append(edit,up,down,del);row.append(acts);children.append(row)});if(!cat.attributes.length)children.innerHTML='<div class="empty" style="margin-bottom:12px">子属性がありません。</div>'}
function categoryDialog(cat){showDialog(cat?'親カテゴリを編集':'親カテゴリを追加',`<div class="field"><label>表示名</label><input id="dName" value="${esc(cat?.name||'')}"></div><div class="field"><label>コード用ID</label><input id="dCode" value="${esc(cat?.code||'')}" placeholder="例: damage"></div><div class="field"><label>説明</label><textarea id="dDesc">${esc(cat?.description||'')}</textarea></div>`,()=>{const name=$('#dName').value.trim(),code=$('#dCode').value.trim();if(!name||!code)return alert('表示名とコード用IDを入力してください。');if(!isCode(code))return alert('コード用IDは半角小文字・数字・アンダースコアで入力してください。');if(data.categories.some(x=>x!==cat&&x.code===code))return alert('同じコード用IDが存在します。');if(cat){cat.name=name;cat.code=code;cat.description=$('#dDesc').value}else{cat={id:uid('cat'),name,code,description:$('#dDesc').value,attributes:[]};data.categories.push(cat);selectedCategory=cat.id}save();renderMaster();return true})}
function childDialog(cat,a){showDialog(a?'子属性を編集':'子属性を追加',`<div class="field"><label>表示名</label><input id="dName" value="${esc(a?.name||'')}"></div><div class="field"><label>コード用ID</label><input id="dCode" value="${esc(a?.code||'')}" placeholder="例: skill_damage"></div><div class="field"><label>親カテゴリ</label><select id="dParent">${data.categories.map(c=>`<option value="${c.id}" ${c.id===cat.id?'selected':''}>${esc(c.name)} (${esc(c.code)})</option>`).join('')}</select></div><div class="field"><label>説明</label><textarea id="dDesc">${esc(a?.description||'')}</textarea></div>`,()=>{const name=$('#dName').value.trim(),code=$('#dCode').value.trim(),parent=data.categories.find(c=>c.id===$('#dParent').value);if(!name||!code)return alert('表示名とコード用IDを入力してください。');if(!isCode(code))return alert('コード用IDは半角小文字・数字・アンダースコアで入力してください。');if(parent.attributes.some(x=>x!==a&&x.code===code))return alert('同じ親カテゴリ内に同じコード用IDがあります。');if(a){cat.attributes=cat.attributes.filter(x=>x!==a);a.name=name;a.code=code;a.description=$('#dDesc').value;parent.attributes.push(a)}else parent.attributes.push({id:uid('attr'),name,code,description:$('#dDesc').value});selectedCategory=parent.id;save();renderMaster();return true})}
function attributeUsage(id){return data.characters.flatMap(c=>SKILLS.filter(([k])=>c.skills[k].attributeIds.includes(id)).map(([k])=>c.name+' '+k))}
function deleteChild(cat,a){const use=attributeUsage(a.id);if(!confirm(`子属性「${a.name}」を削除しますか？${use.length?'\n使用中: '+use.slice(0,8).join('、')+(use.length>8?' ほか':''):''}\n割り当てもすべて解除されます。`))return;cat.attributes=cat.attributes.filter(x=>x.id!==a.id);data.characters.forEach(c=>SKILLS.forEach(([k])=>c.skills[k].attributeIds=c.skills[k].attributeIds.filter(id=>id!==a.id)));save();renderMaster()}
function deleteCategory(cat){const count=cat.attributes.reduce((n,a)=>n+attributeUsage(a.id).length,0);if(!confirm(`親カテゴリ「${cat.name}」と子属性${cat.attributes.length}件を削除しますか？${count?'\nスキルへの割り当て '+count+'件も解除されます。':''}\nこの操作は元に戻せません。`))return;const ids=new Set(cat.attributes.map(a=>a.id));data.characters.forEach(c=>SKILLS.forEach(([k])=>c.skills[k].attributeIds=c.skills[k].attributeIds.filter(id=>!ids.has(id))));data.categories=data.categories.filter(x=>x!==cat);selectedCategory=data.categories[0]?.id||null;save();renderMaster()}
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();render()}
function markdown(chars){let out='# High Mobility MOBA スキル属性\n\n';chars.forEach(c=>{out+=`## ${c.name}${c.code?' (`'+c.code+'`)':''}\n\n`;if(c.notes)out+=`> ${c.notes.replace(/\n/g,'  \n> ')}\n\n`;SKILLS.forEach(([k,label])=>{const s=c.skills[k],attrs=s.attributeIds.map(id=>allAttributes().find(a=>a.id===id)).filter(Boolean);out+=`### ${k==='AA'?'通常攻撃':k}${s.name&&s.name!==label?'：'+s.name:''}\n\n`;if(attrs.length){data.categories.forEach(cat=>{const aa=attrs.filter(a=>a.category.id===cat.id);if(aa.length){out+=`- ${cat.name}\n`;aa.forEach(a=>out+=`  - ${a.name}（${a.fullCode}）\n`)}})}else out+='- 属性未設定\n';if(s.description)out+=`\n説明: ${s.description.replace(/\n/g,'  \n')}\n`;if(s.notes)out+=`\n補足: ${s.notes.replace(/\n/g,'  \n')}\n`;out+='\n'})});return out.trim()+'\n'}
function renderOutput(){const root=$('#view');root.innerHTML=`<div class="output-layout"><div class="card"><div class="field"><label>出力対象</label><select id="outputScope"><option value="all">全キャラクター</option><option value="selected">選択中のキャラクター</option></select></div><button class="btn primary" id="copyMd" style="width:100%;margin-bottom:8px">クリップボードへコピー</button><button class="btn" id="downloadMd" style="width:100%">Markdownを保存</button><p class="muted">この内容をCodexへ貼り付けることで、共通の属性IDを使った実装を指示できます。</p></div><div class="card"><div class="section-title"><h3>プレビュー</h3><span id="mdCount" class="count"></span></div><textarea id="mdPreview" class="preview" spellcheck="false"></textarea></div></div>`;const update=()=>{const chars=$('#outputScope').value==='selected'?(currentChar()?[currentChar()]:[]):data.characters;const txt=markdown(chars);$('#mdPreview').value=txt;$('#mdCount').textContent=txt.length+'字'};$('#outputScope').onchange=update;$('#copyMd').onclick=async()=>{try{await navigator.clipboard.writeText($('#mdPreview').value);flash('コピーしました')}catch(e){$('#mdPreview').select();document.execCommand('copy');flash('コピーしました')}};$('#downloadMd').onclick=()=>download('high-mobility-moba-skill-attributes.md',$('#mdPreview').value,'text/markdown');update()}
function renderData(){const root=$('#view');root.innerHTML=`<div class="grid2"><div class="card"><h3>バックアップ</h3><p class="muted">全キャラクター、スキル、属性マスターをJSONファイルへ保存します。</p><div class="toolbar"><button class="btn primary" id="exportJson">JSONを保存</button><button class="btn" id="importJson">JSONを読み込む</button></div><div class="help" style="margin-top:16px">最終更新: ${esc(new Date(data.updatedAt).toLocaleString('ja-JP'))}<br>キャラクター: ${data.characters.length}件 / 親カテゴリ: ${data.categories.length}件 / 子属性: ${allAttributes().length}件</div></div><div class="card"><h3>初期化</h3><p class="muted">ブラウザ内のデータを消去し、初期データへ戻します。事前にJSONを保存してください。</p><div class="danger-zone"><button class="btn danger" id="resetData">すべて初期化</button></div></div></div>`;$('#exportJson').onclick=()=>download('high-mobility-moba-skill-attributes.json',JSON.stringify(data,null,2),'application/json');$('#importJson').onclick=()=>$('#jsonInput').click();$('#resetData').onclick=()=>{if(!confirm('すべての編集内容を消去して初期化しますか？\nこの操作は元に戻せません。'))return;data=seed();selectedChar=data.characters[0].id;selectedCategory=data.categories[0].id;save();render()}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);flash(name+' を保存しました')}
function showDialog(title,body,onOk){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialogBack').classList.add('open');$('#dialogOk').onclick=()=>{if(onOk()===true)closeDialog()};setTimeout(()=>$('#dialogBody input')?.focus(),30)}function closeDialog(){$('#dialogBack').classList.remove('open')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#charSearch').oninput=renderSidebar;$('#addCharacter').onclick=()=>{const c={id:uid('char'),name:'新しいキャラクター',code:'',notes:'',skills:blankSkills()};data.characters.push(c);selectedChar=c.id;save();render();editCharacter(c)};$('#dialogCancel').onclick=closeDialog;$('#dialogBack').onclick=e=>{if(e.target===$('#dialogBack'))closeDialog()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});$('#jsonInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const x=normalize(JSON.parse(await f.text()));if(x.schemaVersion!==1||!Array.isArray(x.characters)||!Array.isArray(x.categories))throw new Error();if(!confirm(`JSONを読み込み、現在のデータを置き換えますか？\nキャラクター: ${x.characters.length}件`))return;data=x;selectedChar=data.characters[0]?.id||null;selectedCategory=data.categories[0]?.id||null;save();render();flash('JSONを読み込みました')}catch(err){alert('対応していない、または壊れたJSONファイルです。')}};
render();
})();
</script>
</body>
